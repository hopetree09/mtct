key: settings-layout
page: settings
name: 设置页布局（基准）
path: /settings
tags: [benchmark, layout]
visual:
  tolerance: 0.00005
  triage: true
assertions:
  - type: layout
    rules:
      - rule: no_horizontal_scroll
      - rule: no_overflow
        selectors: [".settings-card", ".setting-row", ".seg", ".setting-label", ".setting-control"]
      - rule: text_not_truncated
        selectors: [".page-head h1", ".setting-label", ".setting-desc", ".seg button", ".settings-card"]
      - rule: contrast_ratio
        min_ratio: 3.0
        selectors: [".page-sub", ".setting-desc", ".setting-label"]
  - type: functional
    rules:
      - rule: element_enabled
        selectors: ["[data-testid=theme-dark]"]
      - rule: element_visible
        selectors: [".settings-card"]
      - rule: no_console_error
